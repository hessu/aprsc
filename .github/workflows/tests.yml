name: Build Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # The two variants run in parallel: one built with the work in progress
    # IS2 protocol, which is the default, and one without. The IS2 tests run
    # against the IS2 variant and skip themselves on the other; TestIS2Disabled
    # does the opposite. TestSCTP runs because libsctp-dev is installed.
    name: build (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        variant: [ is2, no-is2 ]
        include:
          - variant: is2
            configure_flags: ""
          - variant: no-is2
            configure_flags: --disable-is2
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2

    - name: install deps
      run: |
        sudo apt-get install -y libevent-dev \
            libprotobuf-c-dev protobuf-c-compiler \
            libprotobuf-dev protobuf-compiler \
            libsctp-dev \
            libssl-dev pkg-config \
            openssl

    - name: configure
      run: |
        cd src
        ./configure ${{ matrix.configure_flags }}

    - name: make
      run: |
        cd src
        make -j4

    - name: make testinstall
      run: |
        cd src
        make testinstall

    - uses: actions/setup-go@v5
      with:
        go-version-file: tests/go/go.mod
        cache-dependency-path: tests/go/go.sum

    - name: Run tests
      run: |
        cd tests
        make test
